# MySQL Recovery Pro - Multi-Version Docker Environment Configuration
# Author: jliang.fang (Global MySQL Kernel QA Expert)
# Version: 3.0.0 - Bullet-proof Chaos Testing Infrastructure
# Purpose: Complete multi-version MySQL environment for recovery testing (MySQL 5.0 - 9.x)

version: '3.8'

x-common-env: &common-env
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123}"
  MYSQL_ROOT_HOST: "%"
  MYSQL_DATABASE: "testdb"
  MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
  MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
  MYSQL_ENABLE_SLOW_QUERY: "1"
  MYSQL_SLOW_QUERY_LOG_FILE: "/var/log/mysql/slow.log"
  MYSQL_LONG_QUERY_TIME: "1"
  TZ: "UTC"
  PMA_PORT: "8080"

x-common-volumes: &common-volumes
  - /var/lib/mysql
  - /var/log/mysql
  - /etc/mysql/conf.d
  - /docker-entrypoint-initdb.d

# Shared volumes for Chaos Testing
volumes:
  # MySQL data directories for each version
  mysql_50_data:
  mysql_50_logs:
  mysql_55_data:
  mysql_55_logs:
  mysql_60_data:
  mysql_60_logs:
  mysql_57_data:
  mysql_57_logs:
  mysql_80_data:
  mysql_80_logs:
  mysql_84_data:
  mysql_84_logs:
  mysql_90_data:
  mysql_90_logs:
  
  # Shared chaos test volume
  chaos_test_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./chaos-test-volumes
  
  # Shared recovery output volume  
  recovery_output_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./recovery-output

# Shared network
networks:
  recovery-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

services:
  ###############################################################################
  # MySQL 5.0 (Far Ancient - Antelope File Format)
  ###############################################################################
  mysql-5.0:
    image: mysql:5.0.96
    container_name: mysql_recovery_50
    environment:
      <<: *common-env
    ports:
      - "33050:3306"
    volumes:
      - mysql_50_data:/var/lib/mysql
      - mysql_50_logs:/var/log/mysql
      - ./docker/mysql.d/5.0:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=0
      - --innodb_file_format=Antelope
      - --innodb_large_prefix=OFF
      - --sql-mode=""
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=256M
      - --innodb_log_buffer_size=16M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=256M
      - --max_heap_table_size=256M
      - --table_open_cache=500
      - --thread_cache_size=64
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  ###############################################################################
  # MySQL 5.5 (Legacy - Antelope/Barracuda transition)
  ###############################################################################
  mysql-5.5:
    image: mysql:5.5.62
    container_name: mysql_recovery_55
    environment:
      <<: *common-env
    ports:
      - "33051:3306"
    volumes:
      - mysql_55_data:/var/lib/mysql
      - mysql_55_logs:/var/log/mysql
      - ./docker/mysql.d/5.5:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --innodb_file_format=Barracuda
      - --innodb_large_prefix=ON
      - --sql-mode=""
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=256M
      - --innodb_log_buffer_size=16M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=256M
      - --max_heap_table_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  ###############################################################################
  # MySQL 5.6 (Barracuda default)
  ###############################################################################
  mysql-5.6:
    image: mysql:5.6.51
    container_name: mysql_recovery_56
    environment:
      <<: *common-env
    ports:
      - "33052:3306"
    volumes:
      - mysql_56_data:/var/lib/mysql
      - mysql_56_logs:/var/log/mysql
      - ./docker/mysql.d/5.6:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --innodb_file_format=Barracuda
      - --innodb_large_prefix=ON
      - --sql-mode=""
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=512M
      - --innodb_log_buffer_size=64M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=512M
      - --max_heap_table_size=512M
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot123", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'

  ###############################################################################
  # MySQL 5.7 (JSON support, improved InnoDB)
  ###############################################################################
  mysql-5.7:
    image: mysql:5.7.44
    container_name: mysql_recovery_57
    environment:
      <<: *common-env
    ports:
      - "33053:3306"
    volumes:
      - mysql_57_data:/var/lib/mysql
      - mysql_57_logs:/var/log/mysql
      - ./docker/mysql.d/5.7:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --sql-mode="NO_ENGINE_SUBSTITUTION"
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=512M
      - --innodb_log_buffer_size=64M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=512M
      - --max_heap_table_size=512M
      - --explicit_defaults_for_timestamp=ON
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot123", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'

  ###############################################################################
  # MySQL 8.0 (LTS - SDI, Data Dictionary, CBO)
  ###############################################################################
  mysql-8.0:
    image: mysql:8.0.36
    container_name: mysql_recovery_80
    environment:
      <<: *common-env
    ports:
      - "33054:3306"
    volumes:
      - mysql_80_data:/var/lib/mysql
      - mysql_80_logs:/var/log/mysql
      - ./docker/mysql.d/8.0:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --sql-mode="NO_ENGINE_SUBSTITUTION"
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=1G
      - --innodb_log_buffer_size=64M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=512M
      - --max_heap_table_size=512M
      - --binlog_format=ROW
      - --default_authentication_plugin=mysql_native_password
      - --table_open_cache=2000
      - --thread_cache_size=64
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot123", "-e", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 60s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'

  ###############################################################################
  # MySQL 8.4 (LTS - Improved Vector, JSON, Protocol Buffer DD)
  ###############################################################################
  mysql-8.4:
    image: mysql:8.4.0
    container_name: mysql_recovery_84
    environment:
      <<: *common-env
    ports:
      - "33055:3306"
    volumes:
      - mysql_84_data:/var/lib/mysql
      - mysql_84_logs:/var/log/mysql
      - ./docker/mysql.d/8.4:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --sql-mode="NO_ENGINE_SUBSTITUTION"
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_allowed_packet=1G
      - --innodb_buffer_pool_size=2G
      - --innodb_log_file_size=2G
      - --innodb_log_buffer_size=64M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=1G
      - --max_heap_table_size=1G
      - --binlog_format=ROW
      - --innodb_large_prefix=ON
      - --table_open_cache=4000
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot123", "-e", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 60s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.5'

  ###############################################################################
  # MySQL 9.0 (Preview - Vector Support, Enhanced JSON)
  ###############################################################################
  mysql-9.0:
    image: mysql:9.0.0
    container_name: mysql_recovery_90
    environment:
      <<: *common-env
    ports:
      - "33056:3306"
    volumes:
      - mysql_90_data:/var/lib/mysql
      - mysql_90_logs:/var/log/mysql
      - ./docker/mysql.d/9.0:/etc/mysql/conf.d:ro
      - ./golden-hashes:/golden-hashes:rw
      - ./test_scripts:/test_scripts:ro
      - chaos_test_volume:/chaos-test:rw
    command:
      - --innodb_file_per_table=1
      - --sql-mode="NO_ENGINE_SUBSTITUTION"
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_allowed_packet=1G
      - --innodb_buffer_pool_size=3G
      - --innodb_log_file_size=2G
      - --innodb_log_buffer_size=128M
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=0
      - --tmp_table_size=1G
      - --max_heap_table_size=1G
      - --binlog_format=ROW
      - --default_authentication_plugin=mysql_caching_sha2_password
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot123", "-e", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 60s
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'

  ###############################################################################
  # phpMyAdmin UI for Multiple Versions
  ###############################################################################

  phpmyadmin-57:
    image: phpmyadmin:5.2.1
    container_name: pma_57
    environment:
      PMA_HOST: mysql-5.7
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 1G
    ports:
      - "8081:80"
    depends_on:
      - mysql-5.7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/pma/index.php"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - recovery-net

  phpmyadmin-80:
    image: phpmyadmin:5.2.1
    container_name: pma_80
    environment:
      PMA_HOST: mysql-8.0
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 1G
    ports:
      - "8082:80"
    depends_on:
      - mysql-8.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/pma/index.php"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - recovery-net

  phpmyadmin-84:
    image: phpmyadmin:6.0.0
    container_name: pma_84
    environment:
      PMA_HOST: mysql-8.4
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123
      UPLOAD_LIMIT: 1G
    ports:
      - "8083:80"
    depends_on:
      - mysql-8.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/pma/index.php"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - recovery-net

  ###############################################################################
  # Data Injectors - Populate test databases
  ###############################################################################

  injector-50:
    image: mysql:5.0.96
    container_name: injector_50
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-5.0:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 5.0...' &&
        mysql -h mysql-50 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-50 -uroot -proot123 testdb < /test_scripts/schema_50.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-50 --port 3306 --num-records 100000 --page-size 16384 --output /golden-hashes/hashes_50.json &&
        echo 'MySQL 5.0 injector completed'
      "

  injector-55:
    image: mysql:5.5.62
    container_name: injector_55
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-5.5:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 5.5...' &&
        mysql -h mysql-55 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-55 -uroot -proot123 testdb < /test_scripts/schema_55.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-55 --port 3306 --num-records 100000 --page-size 16384 --output /golden-hashes/hashes_55.json &&
        echo 'MySQL 5.5 injector completed'
      "

  injector-56:
    image: mysql:5.6.51
    container_name: injector_56
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-5.6:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 5.6...' &&
        mysql -h mysql-56 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-56 -uroot -proot123 testdb < /test_scripts/schema_56.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-56 --port 3306 --num-records 100000 --page-size 16384 --output /golden-hashes/hashes_56.json &&
        echo 'MySQL 5.6 injector completed'
      "

  injector-57:
    image: mysql:5.7.44
    container_name: injector_57
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-5.7:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 5.7...' &&
        mysql -h mysql-57 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-57 -uroot -proot123 testdb < /test_scripts/schema_57.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-57 --port 3306 --num-records 100000 --page-size 16384 --blob-size 32 --output /golden-hashes/hashes_57.json &&
        echo 'MySQL 5.7 injector completed'
      "

  injector-80:
    image: mysql:8.0.36
    container_name: injector_80
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-8.0:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 8.0...' &&
        mysql -h mysql-80 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-80 -uroot -proot123 testdb < /test_scripts/schema_80.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-80 --port 3306 --num-records 100000 --page-size 16384 --blob-size 32 --output /golden-hashes/hashes_80.json &&
        echo 'MySQL 8.0 injector completed'
      "

  injector-84:
    image: mysql:8.4.0
    container_name: injector_84
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-8.4:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 8.4...' &&
        mysql -h mysql-84 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-84 -uroot -proot123 testdb < /test_scripts/schema_84.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-84 --port 3306 --num-records 100000 --page-size 16384 --blob-size 64 --output /golden-hashes/hashes_84.json &&
        echo 'MySQL 8.4 injector completed'
      "

  injector-90:
    image: mysql:9.0.0
    container_name: injector_90
    environment:
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - ./test_scripts:/test_scripts:ro
      - ./golden-hashes:/golden-hashes:rw
      - chaos_test_volume:/chaos-test:rw
    depends_on:
      mysql-9.0:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for MySQL 9.0...' &&
        mysql -h mysql-90 -uroot -proot123 -e 'SELECT 1' &&
        mysql -h mysql-90 -uroot -proot123 testdb < /test_scripts/schema_90.sql &&
        python3 /test_scripts/chaos_injector.py --host mysql-90 --port 3306 --num-records 100000 --page-size 16384 --blob-size 100 --output /golden-hashes/hashes_90.json &&
        echo 'MySQL 9.0 injector completed'
      "

  ###############################################################################
  # Chaos Monkey Container - Corrupt test data
  ###############################################################################

  chaos-monkey:
    image: chaos-test:latest
    container_name: chaos_monkey
    environment:
      - CHAOS_SEED=42
      - CHAOS_SCENARIO=all
    volumes:
      - ./scripts:/scripts:ro
      - chaos_test_volume:/chaos-test:rw
      - ./recovery-output:/recovery-output:rw
    depends_on:
      mysql-5.0:
        condition: service_healthy
      mysql-5.5:
        condition: service_healthy
      mysql-5.6:
        condition: service_healthy
      mysql-5.7:
        condition: service_healthy
      mysql-8.0:
        condition: service_healthy
      mysql-8.4:
        condition: service_healthy
      mysql-9.0:
        condition: service_healthy
    command: >
      bash -c "
        chmod +x /scripts/*.py &&
        echo 'Starting Chaos Monkey...' &&
        python3 /scripts/chaos_injection_suite.py --seed 42 --full-suite &&
        echo 'Chaos tests completed'
      "

  ###############################################################################
  # Recovery Engine - C++ Application
  ###############################################################################

  recovery-engine-debug:
    build:
      context: .
      dockerfile: docker/Dockerfile.recovery-debug
    container_name: recovery_engine_debug
    volumes:
      - chaos_test_volume:/chaos-test:ro
      - ./recovery-output:/recovery-output:rw
      - ./golden-hashes:/golden-hashes:ro
    command: >
      bash -c "
        export ASAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer &&
        export ASAN_OPTIONS=detect_leaks=1,symbolize=1,abort_on_error=1 &&
        /usr/local/bin/mysql_recovery_pro --help &&
        echo 'Recovery engine ready for testing'
      "
    depends_on:
      - chaos-monkey
    networks:
      - recovery-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  recovery-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.recovery
    container_name: recovery_engine
    volumes:
      - chaos_test_volume:/chaos-test:ro
      - ./recovery-output:/recovery-output:rw
      - ./golden-hashes:/golden-hashes:ro
    command: >
      bash -c "
        /usr/local/bin/mysql_recovery_pro --help &&
        echo 'Recovery engine operational'
      "
    depends_on:
      - chaos-monkey
    networks:
      - recovery-net

  ###############################################################################
  # Chaos Pipeline Runner - Orchestrate full testing
  ###############################################################################

  chaos-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.chaos-pipeline
    container_name: chaos_pipeline
    depends_on:
      mysql-5.0:
        condition: service_healthy
      mysql-5.5:
        condition: service_healthy
      mysql-5.6:
        condition: service_healthy
      mysql-5.7:
        condition: service_healthy
      mysql-8.0:
        condition: service_healthy
      mysql-8.4:
        condition: service_healthy
      mysql-9.0:
        condition: service_healthy
      chaos-monkey:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - chaos_test_volume:/chaos-test:ro
      - ./recovery-output:/recovery-output:rw
      - ./golden-hashes:/golden-hashes:rw
    command: >
      bash -c "
        echo '============================================' &&
