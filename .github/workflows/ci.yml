name: MySQL Recovery Pro - CI/CD

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# 环境变量
env:
  CMAKE_BUILD_TYPE: Release
  CCACHE_VERSION: '4.7.4'

# 矩阵构建配置
jobs:
  # Linux x86_64构建和测试
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2.13
      with:
        key: ${{ runner.os }}-x86_64-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libnlohmann-json-dev \
          libz-dev \
          liburing-dev \
          python3

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        make test
        ctest --output-on-failure

  # Linux ARM64构建和测试
  linux-arm64:
    runs-on: ubuntu-latest
    container: gcc:12-arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install cross-compilation tools
      run: |
        apt-get update
        apt-get install -y \
          g++-aarch64-linux-gnu \
          cmake \
          python3 \
          python3-pip

    - name: Configure CMake (Cross-compile)
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

    - name: Build
      run: |
        cd build
        make -j$(nproc)

  # macOS x86_64构建和测试
  macos-x86_64:
    runs-on: macos-13
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2.13
      with:
        key: ${{ runner.os }}-x86_64-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Install dependencies
      run: |
        brew install cmake nlohmann-json zstd

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: |
        cd build
        make test
        ctest --output-on-failure

  # macOS ARM64构建和测试
  macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2.13
      with:
        key: ${{ runner.os }}-ARM64-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Install dependencies
      run: |
        brew install cmake nlohmann-json zstd

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: |
        cd build
        make test
        ctest --output-on-failure

  # Windows x86_64构建和测试
  windows-x86_64:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'v2024.01.08'

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install nlohmann-json:x64-windows zlib:x64-windows

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Run tests
      run: |
        cd build
        ctest -C Release --output-on-failure

  # Windows ARM64交叉编译
  windows-arm64:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake (Cross-compile)
      run: |
        mkdir build && cd build
        cmake .. -G "Visual Studio 17 2022" -A ARM64

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14

    - name: Run clang-tidy
      run: |
        find include src -name "*.hpp" -o -name "*.cpp" | xargs clang-tidy-14 -p build

  # 代码覆盖率
  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libnlohmann-json-dev \
          libz-dev \
          gcovr

    - name: Configure CMake with coverage
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        make test

    - name: Generate coverage report
      run: |
        gcovr --xml > coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 发布
  release:
    needs: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64, windows-x86_64, windows-arm64, code-quality]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/mysql8_recover
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
