name: CI

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux-build:
    name: Linux x86_64 (build + test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgtest-dev \
            libnlohmann-json-dev \
            libboost-filesystem-dev \
            libz-dev \
            liblz4-dev \
            liburing-dev \
            libssl-dev \
            python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -LE "python_ibd_generator_tests" || true
