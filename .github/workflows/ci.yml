name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: 'false'

env:
  CMAKE_BUILD_TYPE: Release
  CC: clang
  CXX: clang++

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Setup C++ compiler (Clang)
        uses: egor-tensin/setup-clang@v1
        with:
          version: '16'

      - name: Setup Google Test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib
          sudo ln -s /usr/lib/libgtest.a /usr/lib/libgtest_main.a

      - name: Setup nlohmann-json
        run: |
          sudo apt-get install -y nlohmann-json3-dev

      - name: Build project
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --verbose --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysql8-recovery-build
          path: |
            build/mysql8_recover
            build/libdbrecovery_innodb.a
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: '16'

      - name: Run clang-tidy
        run: |
          # Generate compile_commands.json
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          
          # Run clang-tidy on source files
          find ../src -name "*.cpp" -exec clang-tidy {} \; \
            --checks=modernize-*,performance-*,readability-*,bugprone-*,cert-*,misc-* \
            -p . 2>&1 | tee clang-tidy-report.txt || true

      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-tidy-report
          path: build/clang-tidy-report.txt
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: '12'

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Build with coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --verbose

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info
          retention-days: 7

  fuzz-testing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: '16'

      - name: Build fuzz targets
        run: |
          mkdir -p build/fuzz
          cd tools
          python3 run_fuzz_test.py all

      - name: Run fuzz tests
        run: |
          cd build/fuzz
          timeout 60s ./fuzz_page_parser corpus/page_parser || true
          timeout 60s ./fuzz_blob_pointer corpus/blob_pointer || true
          timeout 60s ./fuzz_sdi_json corpus/sdi_json || true

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          echo "Checking documentation files..."
          
          # Check if required docs exist
          required_docs=(
            "docs/zh/README.md"
            "docs/zh/architecture.md"
            "docs/zh/user_guide.md"
            "docs/zh/audit_report.md"
            "docs/en/README.md"
            "docs/en/architecture.md"
            "docs/en/user_guide.md"
            "docs/en/audit_report.md"
          )
          
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "Missing documentation: $doc"
              exit 1
            fi
          done
          
          echo "All documentation files present"
          
          # Check for Chinese/English pairs
          for doc in docs/zh/*.md; do
            filename=$(basename "$doc")
            if [ ! -f "docs/en/$filename" ]; then
              echo "Missing English translation: docs/en/$filename"
              exit 1
            fi
          done
          
          echo "All translations present"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          VERSION=$(cat include/version.hpp | grep VERSION | grep -oP '\d+' | tr '\n' '.')
          VERSION=${VERSION%.}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
